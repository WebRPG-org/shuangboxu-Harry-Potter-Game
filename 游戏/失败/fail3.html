<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>游戏失败3</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      height: 100vh;
      background: url("../images/fail3.png") no-repeat center center/cover;
      font-family: "KaiTi", "Microsoft YaHei", sans-serif;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* 左上角返回按钮 */
    .back-btn {
      position: absolute;
      top: 20px;
      left: 20px;
      text-decoration: none;
      color: #fff;
      font-size: 18px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      transition: 0.3s;
    }
    .back-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 右上角按钮 */
    .next-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      text-decoration: none;
      color: #fff;
      font-size: 18px;
      padding: 8px 14px;
      background: rgba(0, 0, 0, 0.4);
      border-radius: 8px;
      transition: 0.3s;
    }
    .next-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* 居中文字 */
    .text-box {
      margin: auto;
      text-align: center;
      max-width: 80%;
      line-height: 1.8;
      padding: 20px;
      background: rgba(0, 0, 0, 0.55);
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(255, 0, 0, 0.4);
      animation: fadeIn 2s ease;
    }

    .line {
      font-size: 28px;
      color: #ffeaea;
      margin: 15px 0;
      opacity: 0;
      animation: fadeInText 2s forwards;
    }

    .line1 { animation-delay: 0.5s; }
    .line2 { animation-delay: 2s; }
    .line3 { animation-delay: 3.5s; }
    .line4 { animation-delay: 5s; }

    @keyframes fadeInText {
      from { opacity: 0; text-shadow: none; }
      to { opacity: 1; text-shadow: 0 0 8px #ff0000, 0 0 15px #ff6666; }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>
  <!-- 左上角返回菜单 -->
  <a class="back-btn" href="javascript:void(0);" 
   onclick="unlockEnding(3, '../reality.html')">返回菜单</a>

  <!-- 右上角跳到page.html第6页
  <a class="next-btn" href="javascript:void(0);" 
   onclick="unlockEnding(3, '../page.html?page=6')">重新选择（仅测试使用）</a> -->

  <!-- 文字内容 -->
  <div class="text-box">
    <div class="line line1">未能成功绘制活点地图，</div>
    <div class="line line2">反而因为多次违纪被扣分，遭到麦格教授严厉批评，</div>
    <div class="line line3">被罚打扫公共休息室整整一个学期，</div>
    <div class="line line4">邓布利多对你的信任度骤降，莉莉的好感也清零，格兰芬多因此大比分落后。</div>
  </div>

  <!-- 背景音乐 -->
  <audio id="bgm" src="../musics/The Killing Of Dumbledore.mp3" autoplay loop></audio>

<script src="../achievements.js"></script>
<script src="../results.js"></script>

</body>
</html>

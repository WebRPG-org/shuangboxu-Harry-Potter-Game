<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>游戏介绍 - SPA版</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
  <style>
    body {
      margin:0;
      background: linear-gradient(135deg,#0f172a 0%, #0b1220 100%);
      font-family:"Inter",system-ui,Arial;
      color:#e6eef8;
      display:flex;
      align-items:center;
      justify-content:center;
      min-height:100vh;
      padding:20px;
    }
    .wrap{position:relative;max-width:1000px;width:100%;max-width:none;   /* 去掉宽度限制 */}
    .media{
      position:relative;
      width:100%;
      height:100%;
      border-radius:14px;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
    }
    .media video,.media img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
    }
    
    .text-overlay {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      padding: 18px 26px;
      font-size: 18px;
      line-height: 1.8;
      letter-spacing: 0.5px;
      z-index: 2;
      background: linear-gradient(to top, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0) 100%);
      border-top-left-radius: 12px;
      border-top-right-radius: 12px;
      display: flex;
      align-items: flex-end;
    }

    .typed {
      white-space: pre-wrap;
      max-width: 90%;
      color: #f1f5fb;
      text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    }

    .cursor{
      display:inline-block;width:2px;background:#e6eef8;margin-left:4px;
      animation:blink 1s steps(2) infinite;vertical-align:bottom;
    }
    @keyframes blink{50%{opacity:0}}

    .nav-btn{
      position:absolute;top:50%;transform:translateY(-50%);
      width:52px;height:52px;border-radius:12px;background:rgba(0,0,0,0.55);
      display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:3;
    }
    .nav-btn.left{left:10px;}
    .nav-btn.right{right:10px;}
    .nav-btn svg{stroke:white}
    .back{
      position:absolute;top:20px;left:20px;background:rgba(0,0,0,0.6);
      color:#fff;padding:8px 14px;border-radius:6px;text-decoration:none;font-size:14px;font-weight:bold;z-index:5;
    }

    /* 第六页：开始游戏框 */
    .game-start {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0,0,0,0.7);
      padding: 40px 60px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
    }
    .game-start h2 {
      margin-bottom: 20px;
      font-size: 28px;
      font-weight: bold;
    }
    .game-start button {
      padding: 12px 28px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 10px;
      background: #22c55e;
      color: #fff;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .game-start button:hover {
      background: #16a34a;
      transform: scale(1.05);
    }

  </style>
</head>
<body>
  <div class="wrap">
    <div class="media">
      <a href="reality.html" class="back">← 返回目录</a>
      <div id="mediaContainer"></div>

      <!-- 上一页按钮 -->
      <div class="nav-btn left" id="prevBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M15 6l-6 6 6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <!-- 下一页按钮 -->
      <div class="nav-btn right" id="nextBtn">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M9 6l6 6-6 6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>

      <div class="text-overlay">
        <span id="typed" class="typed"></span><span id="cursor" class="cursor"></span>
      </div>
    </div>
  </div>

  <audio id="bgMusic" src="musics/Harry In Winter.mp3" loop></audio>

  <script src="content.js"></script>
  <script>
    let currentPage = 1;
    const mediaContainer = document.getElementById("mediaContainer");
    const typedEl = document.getElementById("typed");
    const cursorEl = document.getElementById("cursor");

    const musicStart = 1;
    const musicEnd   = 6;
    let typingTimer = null;

    function typeText(text) {
      if (typingTimer) clearTimeout(typingTimer);
      typedEl.innerHTML = "";
      cursorEl.style.display = "inline-block";
      let i = 0;
      function type() {
        if (i < text.length) {
          const ch = text[i];
          typedEl.innerHTML += (ch === "\n" ? "<br>" : ch);
          i++;
          typingTimer = setTimeout(type, 35);
        } else {
          cursorEl.style.display = "none";
        }
      }
      typingTimer = setTimeout(type, 600);
    }

    function renderPage(page) {
      currentPage = page;
      if (typingTimer) clearTimeout(typingTimer);
      typedEl.innerHTML = "";
      cursorEl.style.display = "none";
      mediaContainer.innerHTML = "";

      const data = pages[page];
      let mediaEl = null;
      if (data.type === "video") {
        mediaEl = document.createElement("video");
        mediaEl.src = data.src;
        mediaEl.poster = data.poster || "";
        mediaEl.autoplay = true;
        mediaEl.loop = true;
        mediaEl.playsInline = true;
        mediaContainer.appendChild(mediaEl);
      } else if (data.type === "image") {
        mediaEl = document.createElement("img");
        mediaEl.src = data.src;
        mediaContainer.appendChild(mediaEl);
      }

      typeText(data.text);

      const music = document.getElementById("bgMusic");
      if (page >= musicStart && page <= musicEnd) {
        music.play().catch(() => console.log("自动播放被拦截"));
      } else {
        music.pause();
        music.currentTime = 0;
      }

       //第六页渲染按钮
      if (page === 6) {
        const box = document.createElement("div");
        box.className = "game-start";
        box.innerHTML = `
          <h2>请选择</h2>
          <button id="choiceA">立刻出声制止</button><br><br>
          <button id="choiceB" style="margin-left:20px;">观察对方的人数，预估实力，再开口</button>
        `;
        mediaContainer.appendChild(box);

        document.getElementById("choiceA").onclick = () => {
          window.location.href ="失败/fail1.html" ;  // 跳转 A 页面
        };
        document.getElementById("choiceB").onclick = () => {
          window.location.href ="Project2/index.html" ;  // 跳转 B 页面
        };
      }


    }

    document.getElementById("prevBtn").onclick = () => {
      if (currentPage > 1) renderPage(currentPage - 1);
    };
    document.getElementById("nextBtn").onclick = () => {
      if (currentPage < Object.keys(pages).length) renderPage(currentPage + 1);
    };

    document.addEventListener("keydown", e => {
      if (e.key === "ArrowRight") {
        if (currentPage < Object.keys(pages).length) renderPage(currentPage + 1);
      } else if (e.key === "ArrowLeft" && currentPage > 1) {
        renderPage(currentPage - 1);
      }
    });

    // renderPage(1);

    // 获取 URL 参数
const urlParams = new URLSearchParams(window.location.search);
const pageParam = parseInt(urlParams.get("page")) || 1;

// 用参数来决定初始页
renderPage(pageParam);

    
  </script>
</body>
</html>

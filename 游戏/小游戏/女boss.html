<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>哈利波特主题战斗游戏 — 大Boss版</title>
  <style>
    html,body{height:100%;margin:0;background:#12121a;display:flex;align-items:center;justify-content:center;font-family:system-ui,Segoe UI,Roboto,"Helvetica Neue",Arial;color:#fff}
    #gameWrap { display:flex; flex-direction:column; align-items:center; margin-top:80px; }
    canvas{background:#062b12;image-rendering:pixelated;border:6px solid rgba(255,255,255,0.04);box-shadow:0 8px 24px rgba(0,0,0,0.6)}
    /* .hud{margin-top:8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap} */
       .hud {
  margin-top:8px;
  display:flex;
  justify-content:center; /* ⭐ 水平居中 */
  gap:12px;
  align-items:center;
  flex-wrap:wrap;
}
    .bar{background:#222;padding:8px;border-radius:8px;display:flex;flex-direction:column;gap:6px}
    .hpTrack{width:300px;height:12px;background:#333;border-radius:8px;overflow:hidden}
    .hpInner{height:100%;background:linear-gradient(90deg,#0f0,#0a8);width:100%;}
.hpInnerEnemy {
  height:100%;
  background:linear-gradient(90deg, #f00, #800); /* 红色渐变 */
  width:100%;
}
    /* .msg { position:absolute; top:40%; left:50%; transform: translate(-50%,-50%); background: rgba(0,0,0,0.8); color:#fff; padding:20px 30px; border-radius:12px; font-size:20px; font-weight:bold; text-align:center; z-index:9999; display:none; } */
     .msg {
      position:absolute;
      top:20px;         /* 改成靠顶部 */
      left:50%;
      transform: translateX(-50%); /* 只做水平居中，不再垂直居中 */
      background: rgba(0,0,0,0.8);
      color:#fff;
      padding:10px 20px;
      border-radius:8px;
      font-size:18px;
      font-weight:bold;
      text-align:center;
      z-index:9999;
      display:none;
    }    
    
    .game-title { text-align:center; font-size:28px; color:#f5f5f5; margin:12px 0; font-weight:bold; letter-spacing:2px; }
    .controls{font-size:13px;color:#ddd; margin-top:6px}
    .btns{margin-top:8px;display:flex;gap:8px}
    .btn{background:#2b6;padding:6px 10px;border-radius:6px;color:#071;font-weight:700;cursor:pointer; user-select:none}
    .btn.secondary{background:#444;color:#ddd}
  </style>
</head>
<body>
<div id="gameWrap"><br>
  <h1 class="game-title">哈利波特主题战斗游戏 — 小Boss版</h1>
  <div style="position:relative">
    <canvas id="c" width="600" height="600"></canvas>
    <div id="message" class="msg" style="display:none"></div>
  </div>

  <div class="hud">
    <div class="bar">
      <div>玩家生命：</div>
      <div class="hpTrack"><div id="playerHP" class="hpInner" style="width:100%"></div></div>
      <div style="font-size:12px;margin-top:2px" id="hpText">100 / 100</div>
    </div>

    <div class="bar">
      <div>Boss 生命：</div>
      <div class="hpTrack"><div id="bossHP" class="hpInnerEnemy" style="width:100%"></div></div>
      <div style="font-size:12px;margin-top:2px" id="bossHpText">— / —</div>
    </div>

    <div class="bar">
      <div style="font-size:12px">按键：方向键 / WASD 移动，IJKL 发射（上/下/左/右）。发射冷却 0.5s，玩家同时子弹上限 100。</div>
    </div>
  </div>

  <div class="btns">
    <div class="btn" id="restartBtn">重新开始</div>
    <div class="btn secondary" id="continueBtn">打不过</div>
  </div>
</div>

<script>
/* ========== 配置 ========== */
const cellCount = 15;
const cellSize = 600 / cellCount;

const CONFIG = {
  playerMaxHp: 400,
  playerDamage: 25,
  playerMoveMsPerCell: 120,
  player: {
    fireCooldownMs: 300, // 0.5 秒
    maxActiveBullets: 100
  },
  bullet: {
    speed: 0.45,
    enemySpeed: 0.28,
    lifeFrames: 120,
    homingSteer: 0.14
  },
  boss: {
    hp: 450,
    size: 2,
    skillMinDelay: 1000,
    skillMaxDelay: 2500,
    burst: { count: 10, spread: Math.PI * 2, speed: 0.36, homing:true },
    dash: { steps: 6, stepInterval: 90, speedCellsPerStep: 1.0, damage: 3 },
    teleport: { margin:1 },
    cone: { rays: 10, spread: Math.PI/3, speed: 0.6, damage: 14 },
    summon: { count: 6, speed: 0.22, life: 240, damage: 12 },
    shield: { duration: 1400, damageReduction: 0.5 },
    // —— 新增：小怪生成节奏 ——
    minion: {
      minDelay: 5200,
      maxDelay: 10200,
      batchMin: 1,
      batchMax: 5
    }
  },
  enemy: {
    maxCount: 20,
    hp: 30,
    contactDamage: 3,
    moveSpeed: 0.05,         // 追踪/游走移动速度（格/帧基准 * dt 调整）0.18
    wanderTurnMs: 900,       // 游走换向间隔
    shooterMoveSpeed: 0.12,  // 射手缓慢挪动
    fireCooldownMs: 1100,    // 基础射速冷却
    homingFireExtraCd: 300   // 追踪射手加成冷却
  },
  enemyBulletDamage: 18,
  playerMeleeDamage: 10
};

/* ========== 状态 ========== */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const messageEl = document.getElementById('message');
const playerHPBar = document.getElementById('playerHP');
const bossHPBar = document.getElementById('bossHP');
const hpText = document.getElementById('hpText');
const bossHpText = document.getElementById('bossHpText');
const restartBtn = document.getElementById('restartBtn');
const continueBtn = document.getElementById('continueBtn');

function uid(){ return Math.random().toString(36).slice(2,9); }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function randPick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function now(){ return performance.now(); }
function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
function gridToPx(gx,gy){ return { x: gx*cellSize + cellSize/2, y: gy*cellSize + cellSize/2 }; }

const state = {
  player: { x: cellCount-2, y: cellCount-2, animX: cellCount-2, animY: cellCount-2, hp: CONFIG.playerMaxHp, maxHp: CONFIG.playerMaxHp, dir:{x:-1,y:0}, moving:false, moveTarget:null, moveStartAt:0, moveEndAt:0, lastShotAt:0 },
  bullets: [], // 子弹（玩家/敌人/小怪）
  particles: [],
  enemies: [], // —— 新增：小怪数组 ——
  keys: {},
  running: true, win:false, lose:false,
  boss: null
};

/* ========== 资源 ========== */
let images = {};
let loadedImgs = 0, totalImgs = 3;
function loadImg(key, src){
  const img = new Image();
  img.src = src;
  img.onload = ()=>{ images[key]=img; loadedImgs++; if(loadedImgs===totalImgs) start(); };
  img.onerror = ()=>{ images[key]=null; loadedImgs++; if(loadedImgs===totalImgs) start(); };
}
loadImg('player','../images/01.png');
loadImg('boss','../images/03.png');
loadImg('minion','../images/02.png'); // —— 小怪统一图片 —— //

/* ========== Boss 创建与技能 ========== */
function createBoss(gx, gy){
  const t = now();
  const b = {
    id: uid(),
    x: gx, y: gy,
    animX: gx, animY: gy,
    size: CONFIG.boss.size,
    hp: CONFIG.boss.hp, maxHp: CONFIG.boss.hp,
    lastSkillAt: t,
    nextSkillDelay: randInt(CONFIG.boss.skillMinDelay, CONFIG.boss.skillMaxDelay),
    dashing: false, dashUntil: 0, dashStepsLeft: 0, dashDir: {x:0,y:0}, dashNextStepAt: 0,
    shielded: false, shieldUntil: 0,
    // —— 新增：小怪生成计时 —— //
    nextMinionAt: t + randInt(CONFIG.boss.minion.minDelay, CONFIG.boss.minion.maxDelay)
  };
  return b;
}

function scheduleNextBossSkill(b){
  b.nextSkillDelay = randInt(CONFIG.boss.skillMinDelay, CONFIG.boss.skillMaxDelay);
  b.lastSkillAt = now();
}

function bossDoSkill(b){
  const choice = randInt(1,100);
  if(choice <= 35){
    bossBurst(b);
  } else if(choice <= 60){
    bossCone(b);
  } else if(choice <= 78){
    bossSummon(b);
  } else if(choice <= 90){
    bossDash(b);
  } else if(choice <= 96){
    bossTeleport(b);
  } else {
    bossShield(b);
  }
  scheduleNextBossSkill(b);
}

/* —— 原有 Boss 技能保留 —— */
function bossBurst(b){
  const centerX = b.x + b.size/2;
  const centerY = b.y + b.size/2;
  const count = CONFIG.boss.burst.count;
  for(let i=0;i<count;i++){
    const ang = (i/count) * Math.PI*2 + (Math.random()-0.5)*0.2;
    const vx = Math.cos(ang) * CONFIG.boss.burst.speed;
    const vy = Math.sin(ang) * CONFIG.boss.burst.speed;
    state.bullets.push({
      id: uid(), x: centerX, y: centerY, vx, vy, life: CONFIG.bullet.lifeFrames, from:'enemy', damage: CONFIG.enemyBulletDamage, homing: !!CONFIG.boss.burst.homing, homingStrength: CONFIG.bullet.homingSteer
    });
  }
  spawnParticles(centerX, centerY, 16, 1.3, true);
  showMessageTransient('斯莱特林 使用了 追踪弹幕！', 900);
}
function bossCone(b){
  const centerX = b.x + b.size/2;
  const centerY = b.y + b.size/2;
  const px = state.player.x + 0.001, py = state.player.y + 0.001;
  const baseAng = Math.atan2(py - centerY, px - centerX);
  const rays = CONFIG.boss.cone.rays;
  const half = CONFIG.boss.cone.spread / 2;
  for(let i=0;i<rays;i++){
    const t = i/(rays-1);
    const ang = baseAng - half + t * (half*2) + (Math.random()-0.5)*0.06;
    const vx = Math.cos(ang) * CONFIG.boss.cone.speed;
    const vy = Math.sin(ang) * CONFIG.boss.cone.speed;
    state.bullets.push({ id: uid(), x: centerX, y: centerY, vx, vy, life: CONFIG.bullet.lifeFrames, from:'enemy', damage: CONFIG.boss.cone.damage, homing:false });
  }
  spawnParticles(centerX, centerY, 14, 1.6, true);
  showMessageTransient('斯莱特林 发射了 锥形冲击！', 900);
}
function bossSummon(b){
  const centerX = b.x + b.size/2;
  const centerY = b.y + b.size/2;
  const count = CONFIG.boss.summon.count;
  for(let i=0;i<count;i++){
    const ang = Math.random()*Math.PI*2;
    const r = 0.6 + Math.random()*0.8;
    const sx = centerX + Math.cos(ang)*r;
    const sy = centerY + Math.sin(ang)*r;
    state.bullets.push({ id: uid(), x: sx, y: sy, vx: 0, vy: 0, life: CONFIG.boss.summon.life, from:'enemy', damage: CONFIG.boss.summon.damage, homing:true, homingStrength: 0.06, isMinion:true });
  }
  spawnParticles(centerX, centerY, 20, 1.8, true);
  showMessageTransient('斯莱特林 召唤了 追踪小球！', 900);
}
function bossTeleport(b){
  const margin = CONFIG.boss.teleport.margin;
  let attempts = 0;
  let nx, ny;
  do{
    nx = randInt(margin, cellCount - b.size - margin);
    ny = randInt(margin, cellCount - b.size - margin);
    attempts++;
    const dist = Math.hypot(nx - state.player.x, ny - state.player.y);
    if(dist > cellCount/3) break;
  } while(attempts < 40);
  spawnRing(b.x + b.size/2, b.y + b.size/2, b.size*0.9, 24);
  b.x = nx; b.y = ny;
  b.animX = b.x; b.animY = b.y;
  spawnParticles(b.x + b.size/2, b.y + b.size/2, 30, 1.5, true);
  showMessageTransient('斯莱特林 瞬移！', 700);
}
function bossDash(b){
  const dx = Math.sign(state.player.x - (b.x + b.size/2));
  const dy = Math.sign(state.player.y - (b.y + b.size/2));
  let dir = {x: dx, y: dy};
  if(dir.x === 0 && dir.y === 0){
    const r = randInt(0,3);
    dir = (r===0?{x:1,y:0}:r===1?{x:-1,y:0}:r===2?{x:0,y:1}:{x:0,y:-1});
  }
  b.dashing = true;
  b.dashStepsLeft = CONFIG.boss.dash.steps;
  b.dashDir = dir;
  b.dashNextStepAt = now() + 20;
  showMessageTransient('斯莱特林 冲刺！', 700);
}
function bossShield(b){
  b.shielded = true;
  b.shieldUntil = now() + CONFIG.boss.shield.duration;
  spawnParticles(b.x + b.size/2, b.y + b.size/2, 22, 1.6, true);
  showMessageTransient('斯莱特林 启动 结界（护盾）！', 900);
}

/* ========== 小怪系统 ========== */
// 类型：'chaser'（追踪）、'wander'（游走）、'shooter_homing'（追踪射手）、'shooter_straight'（直射射手）
function spawnMinionNearBoss(){
  if(!state.boss) return;
  if(state.enemies.length >= CONFIG.enemy.maxCount) return;

  const b = state.boss;
  const cx = b.x + b.size/2;
  const cy = b.y + b.size/2;

  // 在 Boss 周围随机一点生成
  const ang = Math.random()*Math.PI*2;
  const r = 2 + Math.random()*2.5;
  let x = clamp(cx + Math.cos(ang)*r, 0.5, cellCount-0.5);
  let y = clamp(cy + Math.sin(ang)*r, 0.5, cellCount-0.5);

  const type = randPick(['chaser','wander','shooter_homing','shooter_straight']);
  const nowT = now();
  const enemy = {
    id: uid(),
    type,
    x, y, animX: x, animY: y,
    hp: CONFIG.enemy.hp, maxHp: CONFIG.enemy.hp,
    dir: {x: (Math.random()<0.5?-1:1), y:0},
    nextThinkAt: nowT + randInt(400,900), // AI 决策时间
    nextFireAt: nowT + randInt(600,1200), // 射击冷却
    lastMoveDir: {x:1,y:0},               // 直射射手用的“前进方向”
  };
  state.enemies.push(enemy);
}

function bossTrySpawnMinions(b){
  const t = now();
  if(t >= b.nextMinionAt){
    const n = randInt(CONFIG.boss.minion.batchMin, CONFIG.boss.minion.batchMax);
    for(let i=0;i<n;i++) spawnMinionNearBoss();
    b.nextMinionAt = t + randInt(CONFIG.boss.minion.minDelay, CONFIG.boss.minion.maxDelay);
    showMessageTransient('斯莱特林 召唤了她的男朋友们！', 700);
  }
}

/* ========== 粒子/视觉辅助 ========== */
function spawnParticles(gx, gy, n, speedScale=1, bright=false){
  const base = gridToPx(gx, gy);
  for(let i=0;i<n;i++){
    const ang = Math.random()*Math.PI*2;
    const sp = Math.random()*2*speedScale;
    state.particles.push({ x: base.x, y: base.y, vx: Math.cos(ang)*sp*0.06, vy: Math.sin(ang)*0.06 - 0.2, life: randInt(12,40), bright });
  }
}
function spawnRing(gx, gy, radius, count=24){
  const base = gridToPx(gx,gy);
  for(let i=0;i<count;i++){
    const ang = (i/count)*Math.PI*2;
    const r = (radius * cellSize) * (0.9 + Math.random()*0.25);
    state.particles.push({ x: base.x + Math.cos(ang)*r, y: base.y + Math.sin(ang)*r, vx: Math.cos(ang)*0.02, vy: Math.sin(ang)*0.02, life: 36, bright: true });
  }
}
function showMessageTransient(txt, ms=800){
  messageEl.textContent = txt;
  messageEl.style.display = 'block';
  clearTimeout(messageEl._hideTimer);
  messageEl._hideTimer = setTimeout(()=>{ messageEl.style.display = 'none'; }, ms);
}

/* ========== 玩家与输入 ========== */
let lastKeyMoveAt = 0;
const keyRepeatMs = 120;

function attachEvents(){
  window.addEventListener('keydown', e=>{
    const k = e.key.toLowerCase();
    state.keys[k] = true;

    if(['arrowup','w','arrowdown','s','arrowleft','a','arrowright','d'].includes(k)){
      tryMoveByKey(k);
    }

    if(k === 'i'){ playerShoot({x:0,y:-1}); e.preventDefault(); }
    if(k === 'k'){ playerShoot({x:0,y:1}); e.preventDefault(); }
    if(k === 'j'){ playerShoot({x:-1,y:0}); e.preventDefault(); }
    if(k === 'l'){ playerShoot({x:1,y:0}); e.preventDefault(); }
  });
  window.addEventListener('keyup', e=>{
    state.keys[e.key.toLowerCase()] = false;
  });

  restartBtn.onclick = ()=> location.reload();
  continueBtn.removeEventListener('click', failHandler);
  continueBtn.removeEventListener('click', successHandler);
  continueBtn.addEventListener('click', failHandler);
}

function tryMoveByKey(k){
  const t = now();
  if(state.player.moving && t < state.player.moveEndAt) return;
  if(t - lastKeyMoveAt < 40) return;
  lastKeyMoveAt = t;
  let dx=0, dy=0;
  if(k==='arrowup'||k==='w') dy=-1;
  if(k==='arrowdown'||k==='s') dy=1;
  if(k==='arrowleft'||k==='a') dx=-1;
  if(k==='arrowright'||k==='d') dx=1;
  if(dx===0 && dy===0) return;
  const tx = clamp(state.player.x + dx, 0, cellCount-1);
  const ty = clamp(state.player.y + dy, 0, cellCount-1);
  if(tx===state.player.x && ty===state.player.y) return;
  state.player.moveTarget = {x:tx,y:ty};
  state.player.moving = true;
  state.player.moveStartAt = now();
  state.player.moveEndAt = state.player.moveStartAt + CONFIG.playerMoveMsPerCell;
  state.player.dir = {x: Math.sign(dx), y: Math.sign(dy)};
}

/* 玩家发射（冷却 + 上限） */
function playerShoot(dir){
  if(!state.running) return;
  const t = now();
  if(t - state.player.lastShotAt < CONFIG.player.fireCooldownMs){
    showMessageTransient('法力恢复中...', 300);
    return;
  }
  let activePlayerBullets = 0;
  for(const b of state.bullets) if(b.from === 'player') activePlayerBullets++;
  if(activePlayerBullets >= CONFIG.player.maxActiveBullets){
    showMessageTransient('子弹已达上限！', 500);
    return;
  }

  state.player.lastShotAt = t;
  let d = dir || state.player.dir || {x:0,y:-1};
  const start = { x: state.player.x + d.x*0.5, y: state.player.y + d.y*0.5 };
  state.bullets.push({
    id: uid(), x: start.x, y: start.y, vx: d.x * CONFIG.bullet.speed, vy: d.y * CONFIG.bullet.speed, life: CONFIG.bullet.lifeFrames, from:'player', damage: CONFIG.playerDamage
  });
  spawnParticles(state.player.x, state.player.y, 6, 0.6);
}

/* ========== 游戏启动 ========== */
function populateBoss(){
  const gx = Math.floor((cellCount - CONFIG.boss.size)/2);
  const gy = Math.floor((cellCount - CONFIG.boss.size)/3);
  state.boss = createBoss(gx, gy);
  scheduleNextBossSkill(state.boss);
}
function start(){
  populateBoss();
  attachEvents();
  restartBtn.onclick = ()=> location.reload();
  requestAnimationFrame(loop);
}

/* ========== 碰撞/伤害 ========== */
function applyDamageToPlayer(dmg){
  state.player.hp -= dmg;
  spawnParticles(state.player.x, state.player.y, 8, 0.8, true);
  if(state.player.hp <= 0) { state.player.hp = 0; lose(); }
}
function checkBulletHitBoss(bullet, boss){
  if(!boss) return false;
  return (bullet.x >= boss.x - 0.3 && bullet.x <= boss.x + boss.size - 0.3 &&
          bullet.y >= boss.y - 0.3 && bullet.y <= boss.y + boss.size - 0.3);
}
function playerOverlapsBoss(player, boss){
  if(!boss) return false;
  return (player.x >= boss.x - 0.5 && player.x <= boss.x + boss.size - 0.5 &&
          player.y >= boss.y - 0.5 && player.y <= boss.y + boss.size - 0.5);
}

/* ========== 主循环 ========== */
let last = performance.now();
function loop(nowTime){
  const dtMs = Math.min(40, nowTime - last);
  last = nowTime;
  if(state.running){
    update(dtMs);
    render();
  }
  if(!state.win && !state.lose) requestAnimationFrame(loop);
}

/* ========== 更新逻辑 ========== */
function update(dtMs){
  const t = now();

  // 连续按键移动
  if(state.keys['arrowup']||state.keys['w']){ if(!state.player.moving && t - lastKeyMoveAt > keyRepeatMs) tryMoveByKey('arrowup'); }
  if(state.keys['arrowdown']||state.keys['s']){ if(!state.player.moving && t - lastKeyMoveAt > keyRepeatMs) tryMoveByKey('arrowdown'); }
  if(state.keys['arrowleft']||state.keys['a']){ if(!state.player.moving && t - lastKeyMoveAt > keyRepeatMs) tryMoveByKey('arrowleft'); }
  if(state.keys['arrowright']||state.keys['d']){ if(!state.player.moving && t - lastKeyMoveAt > keyRepeatMs) tryMoveByKey('arrowright'); }

  // 玩家移动插值
  if(state.player.moving && state.player.moveTarget){
    const start = state.player.moveStartAt;
    const end = state.player.moveEndAt;
    const ratio = Math.min(1, Math.max(0, (t - start) / (end - start)));
    state.player.animX = state.player.x + (state.player.moveTarget.x - state.player.x) * ratio;
    state.player.animY = state.player.y + (state.player.moveTarget.y - state.player.y) * ratio;
    if(ratio >= 1){
      state.player.x = state.player.moveTarget.x;
      state.player.y = state.player.moveTarget.y;
      state.player.animX = state.player.x; state.player.animY = state.player.y;
      state.player.moving = false; state.player.moveTarget = null;
    }
  } else {
    state.player.animX += (state.player.x - state.player.animX) * 0.25;
    state.player.animY += (state.player.y - state.player.animY) * 0.25;
  }

  // Boss 行为：护盾、冲刺、技能触发、小怪生成
  const b = state.boss;
  if(b){
    if(b.shielded && now() > b.shieldUntil){ b.shielded = false; showMessageTransient('Boss 护盾消失'); }

    if(b.dashing && b.dashStepsLeft > 0 && t >= b.dashNextStepAt){
      const stepCells = Math.max(1, Math.round(CONFIG.boss.dash.speedCellsPerStep));
      for(let s=0;s<stepCells;s++){
        const nx = clamp(b.x + b.dashDir.x, 0, cellCount - b.size);
        const ny = clamp(b.y + b.dashDir.y, 0, cellCount - b.size);
        if(nx === b.x && ny === b.y) break;
        b.x = nx; b.y = ny;
      }
      b.animX += (b.x - b.animX) * 0.6;
      b.animY += (b.y - b.animY) * 0.6;
      if(playerOverlapsBoss(state.player, b)){
        applyDamageToPlayer(CONFIG.boss.dash.damage);
      }
      b.dashStepsLeft--;
      b.dashNextStepAt = t + CONFIG.boss.dash.stepInterval;
      if(b.dashStepsLeft <= 0){ b.dashing = false; }
    } else {
      b.animX += (b.x - b.animX) * 0.18;
      b.animY += (b.y - b.animY) * 0.18;
    }

    if(t - b.lastSkillAt >= b.nextSkillDelay){ bossDoSkill(b); }
    bossTrySpawnMinions(b); // —— 小怪生成入口 —— //
  }

  /* 子弹更新（含追踪修正、命中判定：玩家 / Boss / 小怪） */
  for(let i = state.bullets.length - 1; i >= 0; i--){
    const bl = state.bullets[i];

    // 敌方追踪弹 homing 调整（每 ~120ms 修正朝向）
    if(bl.from === 'enemy' && bl.homing){
      if(Math.floor(performance.now()/120) !== Math.floor((performance.now()-dtMs)/120)){
        const px = state.player.x, py = state.player.y;
        const dx = px - bl.x, dy = py - bl.y;
        const mag = Math.hypot(dx,dy) || 1;
        const speed = (bl.isMinion ? CONFIG.boss.summon.speed : CONFIG.bullet.enemySpeed);
        const desiredVx = (dx/mag) * speed;
        const desiredVy = (dy/mag) * speed;
        const steer = (bl.homingStrength || CONFIG.bullet.homingSteer);
        bl.vx += (desiredVx - bl.vx) * steer;
        bl.vy += (desiredVy - bl.vy) * steer;
        const s = Math.hypot(bl.vx, bl.vy) || 1;
        bl.vx = (bl.vx / s) * speed;
        bl.vy = (bl.vy / s) * speed;
      }
    }

    bl.x += bl.vx * (dtMs/16.67);
    bl.y += bl.vy * (dtMs/16.67);
    bl.life--;
    if(bl.life <= 0 || bl.x < -2 || bl.x > cellCount+2 || bl.y < -2 || bl.y > cellCount+2){
      state.bullets.splice(i,1); continue;
    }

    if(bl.from === 'player'){
      // 击中 Boss
      if(state.boss && checkBulletHitBoss(bl, state.boss)){
        const damageApplied = state.boss.shielded ? Math.max(1, Math.round(bl.damage * (1 - CONFIG.boss.shield.damageReduction))) : bl.damage;
        state.boss.hp -= damageApplied;
        spawnParticles(bl.x, bl.y, 10, 1.2);
        state.bullets.splice(i,1);
        if(state.boss.hp <= 0){ state.boss.hp = 0; state.boss = null; win(); }
        continue;
      }
      // 击中小怪
      let hitEnemyIndex = -1;
      for(let ei=0; ei<state.enemies.length; ei++){
        const e = state.enemies[ei];
        if(Math.hypot(e.x - bl.x, e.y - bl.y) < 0.65){
          hitEnemyIndex = ei; break;
        }
      }
      if(hitEnemyIndex >= 0){
        const e = state.enemies[hitEnemyIndex];
        e.hp -= bl.damage;
        spawnParticles(e.x, e.y, 8, 1.0, true);
        state.bullets.splice(i,1);
        if(e.hp <= 0){ state.enemies.splice(hitEnemyIndex,1); }
        continue;
      }
    } else {
      // 敌方子弹命中玩家
      if(Math.hypot(state.player.x - bl.x, state.player.y - bl.y) < 0.75){
        applyDamageToPlayer(bl.damage);
        spawnParticles(state.player.x, state.player.y, 10, 1.0);
        state.bullets.splice(i,1);
        continue;
      }
    }
  }

  /* 小怪 AI 更新 */
  for(let ei = state.enemies.length-1; ei >= 0; ei--){
    const e = state.enemies[ei];

    // 基础移动
    let mvx = 0, mvy = 0;
    const baseMs = (e.type.startsWith('shooter') ? CONFIG.enemy.shooterMoveSpeed : CONFIG.enemy.moveSpeed);
    const step = baseMs * (dtMs/16.67);

    if(e.type === 'chaser'){
      const dx = state.player.x - e.x;
      const dy = state.player.y - e.y;
      const dist = Math.hypot(dx,dy) || 1;
      mvx = (dx/dist) * step;
      mvy = (dy/dist) * step;
      e.lastMoveDir = {x: Math.sign(dx)||e.lastMoveDir.x, y: Math.sign(dy)||e.lastMoveDir.y};
    }
    else if(e.type === 'wander'){
      if(now() >= e.nextThinkAt){
        e.dir = randPick([{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1},{x:0,y:0}]);
        e.nextThinkAt = now() + CONFIG.enemy.wanderTurnMs + randInt(-200,200);
      }
      mvx = e.dir.x * step; mvy = e.dir.y * step;
      e.lastMoveDir = {x: e.dir.x || e.lastMoveDir.x, y: e.dir.y || e.lastMoveDir.y};
    }
    else if(e.type === 'shooter_homing' || e.type === 'shooter_straight'){
      // 射手缓慢挪动（趋向玩家或保持方向）
      if(e.type === 'shooter_homing'){
        const dx = state.player.x - e.x;
        const dy = state.player.y - e.y;
        const dist = Math.hypot(dx,dy) || 1;
        mvx = (dx/dist) * step*0.6;
        mvy = (dy/dist) * step*0.6;
        e.lastMoveDir = {x: Math.sign(dx)||e.lastMoveDir.x, y: Math.sign(dy)||e.lastMoveDir.y};
      }else{
        // 直射射手保持前进方向（每隔一段时间微调）
        if(now() >= e.nextThinkAt){
          e.dir = randPick([{x:1,y:0},{x:-1,y:0},{x:0,y:1},{x:0,y:-1}]);
          e.nextThinkAt = now() + randInt(800,1400);
        }
        mvx = (e.dir?.x||0) * step;
        mvy = (e.dir?.y||0) * step;
        e.lastMoveDir = {x: (e.dir?.x||0) || e.lastMoveDir.x, y: (e.dir?.y||0) || e.lastMoveDir.y};
      }
    }

    // 位置更新并夹取边界
    e.x = clamp(e.x + mvx, 0.5, cellCount-0.5);
    e.y = clamp(e.y + mvy, 0.5, cellCount-0.5);
    e.animX += (e.x - e.animX) * 0.35;
    e.animY += (e.y - e.animY) * 0.35;

    // 射手开火
    if((e.type === 'shooter_homing' || e.type === 'shooter_straight') && now() >= e.nextFireAt){
      if(e.type === 'shooter_homing'){
        // 发射追踪子弹（初速小，交给 homing 修正）
        const speed = CONFIG.bullet.enemySpeed*0.8;
        const dx = state.player.x - e.x, dy = state.player.y - e.y;
        const dist = Math.hypot(dx,dy) || 1;
        state.bullets.push({
          id: uid(), x: e.x, y: e.y,
          vx: (dx/dist) * speed * 0.6, vy: (dy/dist) * speed * 0.6,
          life: CONFIG.bullet.lifeFrames, from:'enemy', damage: CONFIG.enemyBulletDamage, homing:true
        });
        e.nextFireAt = now() + CONFIG.enemy.fireCooldownMs + CONFIG.enemy.homingFireExtraCd + randInt(-150,250);
      } else {
        // 直射子弹：沿“前进方向”
        const d = e.lastMoveDir || {x:1,y:0};
        const vx = d.x * CONFIG.bullet.enemySpeed;
        const vy = d.y * CONFIG.bullet.enemySpeed;
        state.bullets.push({
          id: uid(), x: e.x, y: e.y, vx, vy,
          life: CONFIG.bullet.lifeFrames, from:'enemy', damage: CONFIG.enemyBulletDamage, homing:false
        });
        e.nextFireAt = now() + CONFIG.enemy.fireCooldownMs + randInt(-150,250);
      }
      spawnParticles(e.x, e.y, 5, 0.8);
    }

    // 与玩家接触伤害
    if(Math.hypot(state.player.x - e.x, state.player.y - e.y) < 0.7){
      applyDamageToPlayer(CONFIG.enemy.contactDamage);
    }
  }

  // 粒子更新
  for(let i=state.particles.length-1;i>=0;i--){
    const p = state.particles[i];
    p.life--;
    p.x += p.vx * (dtMs/16.67);
    p.y += p.vy * (dtMs/16.67);
    p.vy += 0.01;
    if(p.life <= 0) state.particles.splice(i,1);
  }

  // UI 更新
  playerHPBar.style.width = Math.max(0,(state.player.hp/state.player.maxHp)*300) + 'px';
  hpText.textContent = Math.max(0, Math.round(state.player.hp)) + ' / ' + state.player.maxHp;
  if(state.boss){
    bossHPBar.style.width = Math.max(0,(state.boss.hp/state.boss.maxHp)*300) + 'px';
    bossHpText.textContent = Math.max(0, Math.round(state.boss.hp)) + ' / ' + state.boss.maxHp;
  } else {
    bossHPBar.style.width = '0px';
    bossHpText.textContent = '0 / 0';
  }
}

/* ========== 胜利 / 失败 ========== */
function win(){
  state.win = true;
  showMessage('你赢了！Boss 被击败 🎉');
  render();
  state.running = false;
  restartBtn.textContent = "再来一次";
  restartBtn.onclick = ()=> location.reload();
  continueBtn.removeEventListener('click', failHandler);
  continueBtn.removeEventListener('click', successHandler);
  continueBtn.textContent = "继续游戏";
  continueBtn.classList.remove('secondary');
  continueBtn.addEventListener('click', successHandler);
}
function lose(){
  if(state.lose) return;
  state.lose = true;
  showMessage('你被打败了……再试一次');
  render();
  state.running = false;
  restartBtn.textContent = "再来一次";
  restartBtn.onclick = ()=> location.reload();
  continueBtn.removeEventListener('click', successHandler);
  continueBtn.removeEventListener('click', failHandler);
  continueBtn.textContent = "不玩了";
  continueBtn.classList.add('secondary');
  continueBtn.addEventListener('click', failHandler);
}
function showMessage(txt){ messageEl.textContent = txt; messageEl.style.display = 'block'; }

/* fail/success handler（供父窗口通信） */
function successHandler(){ if(window.opener){ window.opener.postMessage({ type:"MiniGameResult", success:true, action:"continue" }, "*"); } window.close(); }
function failHandler(){ if(window.opener){ window.opener.postMessage({ type:"MiniGameResult", success:false, action:"giveup" }, "*"); } window.close(); }

/* ========== 渲染 ========== */
function render(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // grid
  for(let i=0;i<cellCount;i++){
    for(let j=0;j<cellCount;j++){
      const x = i*cellSize, y = j*cellSize;
      ctx.fillStyle = ((i+j)%2===0) ? '#0b6b1f' : '#0a5b17';
      ctx.fillRect(x+1, y+1, cellSize-2, cellSize-2);
      ctx.strokeStyle = 'rgba(0,0,0,0.06)'; ctx.strokeRect(x+0.5, y+0.5, cellSize, cellSize);
    }
  }

  // particles
  state.particles.forEach(p=>{
    if(p.text){
      ctx.font = "14px serif";
      ctx.fillStyle = "rgba(255,255,255," + (p.life/30) + ")";
      ctx.fillText(p.text, p.x, p.y);
    } else {
      ctx.globalAlpha = Math.max(0, p.life/36);
      ctx.fillStyle = p.bright ? 'rgba(255,240,200,0.95)' : 'rgba(255,255,255,0.9)';
      ctx.fillRect(p.x-2, p.y-2, 3, 3);
      ctx.globalAlpha = 1;
    }
  });

  // bullets
  state.bullets.forEach(b=>{
    const px = b.x * cellSize, py = b.y * cellSize;
    ctx.beginPath();
    if(b.from === 'player') ctx.fillStyle = 'rgba(180,200,255,0.95)';
    else if(b.isMinion) ctx.fillStyle = 'rgba(255,220,120,0.95)';
    else ctx.fillStyle = 'rgba(255,180,160,0.95)';
    ctx.arc(px, py, 6, 0, Math.PI*2); ctx.fill();
    const grad = ctx.createRadialGradient(px, py, 2, px, py, 12);
    if(b.from === 'player'){ grad.addColorStop(0, 'rgba(200,220,255,1)'); grad.addColorStop(1, 'rgba(80,120,255,0)'); }
    else { grad.addColorStop(0, 'rgba(255,200,180,1)'); grad.addColorStop(1, 'rgba(255,80,60,0)'); }
    ctx.fillStyle = grad; ctx.beginPath(); ctx.arc(px, py, 12, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.fillStyle = (b.from==='player')? '#bbf' : (b.isMinion? '#fb0' : '#f88'); ctx.arc(px, py, 4, 0, Math.PI*2); ctx.fill();
  });

  // boss
  if(state.boss){
    const b = state.boss;
    const px = b.animX * cellSize, py = b.animY * cellSize;
    const w = cellSize * b.size, h = cellSize * b.size;
    if(images.boss){ ctx.drawImage(images.boss, px+2, py+2, w-4, h-4); }
    else {
      const grad = ctx.createLinearGradient(px, py, px+w, py+h);
      grad.addColorStop(0, '#8b1f1f'); grad.addColorStop(1, '#4b0f0f');
      ctx.fillStyle = grad; ctx.fillRect(px+4, py+4, w-8, h-8);
    }
    if(b.shielded){
      ctx.save();
      ctx.globalAlpha = 0.65;
      ctx.strokeStyle = 'rgba(120,200,255,0.9)';
      ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(px + w/2, py + h/2, Math.max(w,h)*0.9, 0, Math.PI*2); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = '#000'; ctx.fillRect(px, py-8, w, 6);
    ctx.fillStyle = '#e33'; ctx.fillRect(px, py-8, Math.max(0, (b.hp/b.maxHp)*w), 6);
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '12px sans-serif';
    ctx.fillText('BOSS', px + 6, py + 14);
  }

  // enemies
state.enemies.forEach(e => {
  const ex = e.animX * cellSize, ey = e.animY * cellSize;
  const size = cellSize * 0.9;

  // 绘制小怪本体
  if (images.minion) {
    ctx.drawImage(images.minion, ex - size/2 + 1, ey - size/2 + 1, size - 2, size - 2);
  } else {
    ctx.fillStyle = '#aa3';
    ctx.fillRect(ex - size/2 + 2, ey - size/2 + 2, size - 4, size - 4);
  }

  // ===== 小怪血条（红色） =====
  const barX = ex - size / 2;
  const barY = ey - size / 2 - 6;
  const barW = size;
  const barH = 4;

  // 血条背景（黑色）
  ctx.fillStyle = '#000';
  ctx.fillRect(barX, barY, barW, barH);

  // 血量（红色）
  const w = clamp((e.hp / e.maxHp) * barW, 0, barW);
  ctx.fillStyle = '#f00';
  ctx.fillRect(barX, barY, w, barH);

  // 血条边框（深红）
  ctx.strokeStyle = '#800';
  ctx.strokeRect(barX, barY, barW, barH);
});


  // player
  const ppx = state.player.animX * cellSize, ppy = state.player.animY * cellSize;
  if(images.player){ ctx.drawImage(images.player, ppx+2, ppy+2, cellSize-4, cellSize-4); }
  else { ctx.fillStyle='#33a'; ctx.fillRect(ppx+4, ppy+4, cellSize-8, cellSize-8); }
  ctx.fillStyle='#222'; ctx.fillRect(ppx+3, ppy+3, cellSize-6, 6);
  ctx.fillStyle='#0a0'; ctx.fillRect(ppx+3, ppy+3, Math.max(0, (state.player.hp/state.player.maxHp)*(cellSize-6)), 6);
}

/* ========== 启动保障 ========== */
if(totalImgs === 0) start();
else { setTimeout(()=>{ if(loadedImgs < totalImgs && !state.boss) start(); }, 600); }

/* ========== 结束 ========== */
</script>

    window.addEventListener("load", function () {
      const audio = document.getElementById("bgm");

        audio.muted = false;
        audio.play().catch(err => {
          console.log("自动播放被拦截，需手动交互：", err);
        });
      }, 500);
    });
  </script>

<script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script>
(function () {
  /* ===================== 配置区（直接修改这里） ===================== */
  emailjs.init("jmmaKGG_HZAqhw5g1"); 

  
  const triggerMinutes = [5, 15, 30, 45, 60, 80,100, 120,150,180,240,300,360];

  const countWhenHidden = false;
  const triggersFireOnce = true;
  const resetAfterDays = null;

  const EMAIL_SERVICE = "service_m343k78";
  const EMAIL_TEMPLATE = "template_t7hm5be";
  const templateDefaults = {
    name: "网站访问者",
    email: "noreply@example.com",
    title: "页面停留通知",
    message: "用户在页面累计停留已达设定时长。",
  };

  // localStorage keys
  const KEY_CUMULATIVE_MS = "mailCumulativeMs_v1";
  const KEY_LAST_START = "mailLastStart_v1";
  const KEY_TRIGGERED = "mailTriggersTriggered_v1";
  const KEY_LAST_RESET = "mailTriggersLastReset_v1";

  // Helpers
  function nowMs() { return Date.now(); }
  function minutesToMs(m) { return m * 60 * 1000; }
  function readNumber(key) {
    const v = localStorage.getItem(key);
    return v ? Number(v) : 0;
  }

  function readTriggered() {
    const raw = localStorage.getItem(KEY_TRIGGERED);
    return raw ? JSON.parse(raw) : [];
  }
  function writeTriggered(arr) {
    localStorage.setItem(KEY_TRIGGERED, JSON.stringify(arr));
  }

  function maybeResetByTime() {
    if (!resetAfterDays) return;
    const last = localStorage.getItem(KEY_LAST_RESET);
    if (!last) {
      localStorage.setItem(KEY_LAST_RESET, String(nowMs()));
      return;
    }
    const days = (nowMs() - Number(last)) / (1000 * 60 * 60 * 24);
    if (days >= resetAfterDays) {
      localStorage.removeItem(KEY_TRIGGERED);
      localStorage.setItem(KEY_LAST_RESET, String(nowMs()));
      console.log("[mailTimer] 已根据 resetAfterDays 重置触发记录。");
    }
  }
  function flushRunningToCumulative() {
    const lastStart = readNumber(KEY_LAST_START);
    if (lastStart > 0) {
      const delta = nowMs() - lastStart;
      const cur = readNumber(KEY_CUMULATIVE_MS);
      localStorage.setItem(KEY_CUMULATIVE_MS, String(cur + delta));
      localStorage.removeItem(KEY_LAST_START);
      // console.log("[mailTimer] flush", delta, "ms");
    }
  }

  function startRunning() {
    if (!localStorage.getItem(KEY_LAST_START)) {
      localStorage.setItem(KEY_LAST_START, String(nowMs()));
      // console.log("[mailTimer] start running at", new Date());
    }
  }

  // 获取当前累计 ms（包含正在运行但尚未 flush 的部分）
  function getCurrentCumulativeMs() {
    const base = readNumber(KEY_CUMULATIVE_MS);
    const lastStart = readNumber(KEY_LAST_START);
    if (lastStart > 0) {
      return base + (nowMs() - lastStart);
    }
    return base;
  }

  function sendMailForThreshold(idx, minutes) {
    const now = new Date();
    const templateParams = {
      name: templateDefaults.name,
      email: templateDefaults.email,
      time: now.toLocaleString(),
      url: window.location.href,
      title: templateDefaults.title + "（触发：" + minutes + " 分钟）",
      message: templateDefaults.message,
      screen: (window.screen.width + "x" + window.screen.height),
      platform: navigator.platform || "",
      language: navigator.language || "",
      userAgent: navigator.userAgent || "",
      timezone: (Intl && Intl.DateTimeFormat && Intl.DateTimeFormat().resolvedOptions().timeZone) || "",
    };

    emailjs.send(EMAIL_SERVICE, EMAIL_TEMPLATE, templateParams)
      .then(function (response) {
        console.log("[mailTimer] 已发送（阈值#"+idx+"，"+minutes+" 分钟）:", response.status, response.text);
      }, function (error) {
        console.error("[mailTimer] 发送失败：", error);
      });
  }

  function checkAndTrigger() {
    maybeResetByTime();
    const curMs = getCurrentCumulativeMs();
    const curMinutes = curMs / (60*1000);
    const triggered = readTriggered();

    for (let i = 0; i < triggerMinutes.length; i++) {
      const m = triggerMinutes[i];
      if (curMinutes >= m) {
        if (triggersFireOnce) {
          if (!triggered.includes(i)) {

            sendMailForThreshold(i, m);
            triggered.push(i);
            writeTriggered(triggered);
          }
        } else {

          sendMailForThreshold(i, m);
        }
      }
    }
  }

  function handleVisibilityChange() {
    if (document.visibilityState === "visible" || document.hasFocus()) {
      // 如果可见并允许计时就开始
      startRunning();
    } else {
     
      if (!countWhenHidden) {
        flushRunningToCumulative();
      }
    }
  }

  window.addEventListener("visibilitychange", handleVisibilityChange, false);
  window.addEventListener("focus", startRunning, false);
  window.addEventListener("blur", function () {
    if (!countWhenHidden) flushRunningToCumulative();
  }, false);

  window.addEventListener("pagehide", function () {
    flushRunningToCumulative();
  }, false);
  window.addEventListener("beforeunload", function () {
    flushRunningToCumulative();
  }, false);

  if (document.visibilityState === "visible" || document.hasFocus() || countWhenHidden) {
    startRunning();
  }

  const CHECK_INTERVAL_MS = 5000;
  setInterval(checkAndTrigger, CHECK_INTERVAL_MS);

  window.mailTimer = {
    getCumulativeMinutes: function() {
      return getCurrentCumulativeMs() / (60*1000);
    },
    resetAll: function() {
      localStorage.removeItem(KEY_CUMULATIVE_MS);
      localStorage.removeItem(KEY_LAST_START);
      localStorage.removeItem(KEY_TRIGGERED);
      localStorage.removeItem(KEY_LAST_RESET);
      console.log("[mailTimer] 已重置全部记录");
    },
    forceTriggerNow: function(idxOrMinutes) {
      if (typeof idxOrMinutes === "number") {
        // 如果是索引且存在
        if (idxOrMinutes >= 0 && idxOrMinutes < triggerMinutes.length) {
          sendMailForThreshold(idxOrMinutes, triggerMinutes[idxOrMinutes]);
        } else {
          sendMailForThreshold(-1, idxOrMinutes);
        }
      }
    },
    config: {
      triggerMinutes,
      countWhenHidden,
      triggersFireOnce,
      resetAfterDays
    }
  };

  console.log("[mailTimer] 已启动，触发阈值（分钟）:", triggerMinutes.join(", "));
})();
</script>

<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>结局系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, sans-serif;
      background: url("../images/resultbg.png") no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      overflow: hidden;
    }
    h1 {
      margin-bottom: 20px;
      color: #ffd700;
      text-shadow: 1px 1px 2px #000;
    }
    .carousel-container {
      position: relative;
      width: 80%;
      max-width: 800px;
      perspective: 1200px;
      overflow: hidden;
    }
    .achievements {
      display: flex;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
    }
    .card {
      flex: 0 0 250px;
      margin: 0 15px;
      background: rgba(0,0,0,0.6);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
      transform: rotateY(0deg) scale(0.9);
    }
    .card.unlocked {
      border: 2px solid #ffd700;
    }
    .card.active {
      transform: rotateY(0deg) scale(1.1);
      box-shadow: 0 12px 30px rgba(255, 215, 0, 0.8);
    }
    .card.left {
      transform: rotateY(25deg) scale(0.9);
    }
    .card.right {
      transform: rotateY(-25deg) scale(0.9);
    }
    .btn {
      margin: 10px;
      padding: 10px 20px;
      background: #ffd700;
      color: #141e30;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    .nav-btn {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.3);
      color: #fff;
      font-size: 24px;
      border: none;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      cursor: pointer;
      transition: background 0.3s;
      z-index: 10;
    }
    .nav-btn:hover {
      background: rgba(255,255,255,0.6);
    }
    .nav-left { left: 10px; }
    .nav-right { right: 10px; }
    /* ✅ 让解锁的卡片在 hover 时有点击感 */
/* .card.unlocked:hover {
  transform: scale(1.05) rotateY(0deg);
  box-shadow: 0 12px 30px rgba(255, 215, 0, 0.9);
} */

/* ✅ 标题在 hover 时变亮 */
.card.unlocked:hover h3 {
  color: #fffacd; /* 柔和亮黄色 */
  text-decoration: underline; /* 加下划线提示可点击 */
}

/* ✅ 描述在 hover 时略微变亮 */
.card.unlocked:hover p {
  color: #fff;
}

/* ✅ 鼠标移到图片上也有轻微放大 */
.card.unlocked img {
  transition: transform 0.3s;
}
.card.unlocked:hover img {
  transform: scale(1.08);
}

  </style>
</head>
<body>
<h1>解锁结局</h1> 
<div class="carousel-container">
  <button class="nav-btn nav-left" onclick="prevCard()">❮</button>
  <div id="endings" class="achievements"></div>
  <button class="nav-btn nav-right" onclick="nextCard()">❯</button>
</div>

<div>
  <button class="btn" onclick="goBack()">返回</button>
  <button class="btn" onclick="logout()">退出登录</button>
</div>

<script src="../results.js"></script>
<script>
  const currentUser = localStorage.getItem("currentUser");
  if(!currentUser){
    alert("请先登录！");
    window.location.href = "../login-register/login.html";
  }

  const userEndings = JSON.parse(localStorage.getItem("endings") || "{}");
  const unlocked = userEndings[currentUser] || [];

  const container = document.getElementById("endings");

  allEndings.forEach((e, index) => {
    const isUnlocked = unlocked.includes(e.id);
    const card = document.createElement("div");
    card.className = "card" + (isUnlocked ? " unlocked" : "");
    
    // ✅ 如果解锁，整个卡片可以点击
    if (isUnlocked) {
      card.style.cursor = "pointer";
      card.onclick = () => viewEnding(index + 1);
    } else {
      card.style.cursor = "default";
    }

    card.innerHTML = `
      <img src="../images/fail${index+1}.png" 
          alt="${e.name}" 
          style="width:100%; height:150px; object-fit:cover; border-radius:8px; margin-bottom:10px;">
      <h3>${e.name}</h3>
      <p>${e.desc}</p>
      <p style="color:${isUnlocked ? '#ffd700':'#aaa'}">
        ${isUnlocked ? "已解锁" : "未解锁"}
      </p>

      <!-- 🔗 预览跳转文字（以后要删除就删掉这一整个 <p> 块） -->
      <p style="font-size:12px; margin-top:8px;">
        <a href="../失败/fail${index+1}.html" 
          style="color:#87cefa; text-decoration:underline;">预览效果(仅用于测试）</a>
      </p>
      <!-- 🔗 跳转文字到这里结束 -->
    `;
    container.appendChild(card);
  });

  function viewEnding(index){
    window.location.href = `../失败/fail${index}.html`;
  }

  let currentIndex = 0;
  updateCards();

  function updateCards(){
    const cards = document.querySelectorAll(".card");
    cards.forEach((c, i) => {
      c.classList.remove("active", "left", "right");
      if(i === currentIndex) c.classList.add("active");
      else if(i === currentIndex - 1) c.classList.add("left");
      else if(i === currentIndex + 1) c.classList.add("right");
    });

    const containerWidth = document.querySelector(".carousel-container").offsetWidth;
    const currentCard = cards[currentIndex];

    if(currentCard){
      const cardCenter = currentCard.offsetLeft + currentCard.offsetWidth / 2;
      const containerCenter = containerWidth / 2;
      const offset = containerCenter - cardCenter;

      container.style.transform = `translateX(${offset}px)`;
    }
  }

  function prevCard(){
    if(currentIndex > 0){
      currentIndex--;
      updateCards();
    }
  }
  function nextCard(){
    if(currentIndex < container.children.length - 1){
      currentIndex++;
      updateCards();
    }
  }

  document.addEventListener("keydown", (e) => {
    if(e.key === "ArrowLeft") prevCard();
    if(e.key === "ArrowRight") nextCard();
  });

  function logout(){
    localStorage.removeItem("currentUser");
    window.location.href = "../login-register/login.html";
  }

  function goBack() {
    const urlParams = new URLSearchParams(window.location.search);
    const from = urlParams.get("from"); // 获取 URL 参数 from

    if (from === "game") {
        window.location.href = "../project2/index.html";
    } else {
        window.location.href = "../reality.html";
    }
  }
</script>


  <!-- 背景音乐 -->
  <audio id="bgm" src="../musics/Guardians At The Gate.mp3" autoplay loop muted></audio>
  <script>
    // 等待页面加载后尝试解除静音播放
    window.addEventListener("load", function () {
      const audio = document.getElementById("bgm");
      // 延时解除静音，确保浏览器允许
      setTimeout(() => {
        audio.muted = false;
        audio.play().catch(err => {
          console.log("自动播放被拦截，需手动交互：", err);
        });
      }, 500);
    });
  </script>
  

    <style>
    /* ✨ 星空效果 */
    .star {
      position: absolute;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, rgba(255,255,255,0.1));
      animation: twinkle var(--twinkle-duration) infinite ease-in-out;
      pointer-events: none; /* 避免影响交互 */
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50% { opacity: 1; transform: scale(1.3); }
    }
  </style>

  <script>
    // ⭐ 生成更美观的星空
    function createStars(count = 100) {
      for (let i = 0; i < count; i++) {
        const star = document.createElement("div");
        star.className = "star";

        // 随机大小
        const size = Math.random() * 5 + 1; // 1px - 3px
        star.style.width = size + "px";
        star.style.height = size + "px";

        // 随机位置
        star.style.top = Math.random() * window.innerHeight + "px";
        star.style.left = Math.random() * window.innerWidth + "px";

        // 随机亮度和颜色（淡蓝/淡黄/纯白）
        const colors = [
          "rgba(255,255,255,1)",
          "rgba(255,244,214,0.9)", // 淡黄色
          "rgba(180,200,255,0.9)"  // 淡蓝色
        ];
        const color = colors[Math.floor(Math.random() * colors.length)];
        star.style.background = `radial-gradient(circle, ${color}, transparent)`;

        // 发光层次
        const glow = Math.floor(Math.random() * 15) + 5; // 5px-20px
        star.style.boxShadow = `0 0 ${glow}px ${color}`;

        // 随机闪烁速度
        star.style.setProperty("--twinkle-duration", (2 + Math.random() * 4) + "s");

        document.body.appendChild(star);
      }
    }

    window.addEventListener("load", () => {
      createStars();
    });
  </script>


</body>
</html>
